# The full suite on every push, where no one can skip it from a laptop.
#
# Windows, because the app is: the scheduler, the launcher and the pre-commit wrapper are
# Windows-specific, and a green Linux run would prove less than it looks like. The map
# checks (tests/test_map.py, tests/test_traps.py) are part of the suite, so a commit that
# skipped the hook still cannot land a map that disagrees with the code.

name: tests

on:
  push:
  pull_request:

jobs:
  suite:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]" -c constraints.txt
      - name: Lint and format
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Map is current
        run: python -m optscan map check
      - name: Suite
        run: python -m pytest
