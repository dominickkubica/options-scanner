[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "optscan"
version = "0.1.0"
description = "Options selling scanner and dashboard"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    # Phase 1: data layer
    "yfinance>=0.2.40",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "pandas-market-calendars>=4.4",
    # Phase 2: analytics. scipy is used only for root finding in the vol solver.
    "scipy>=1.13",
    # Phase 3: screener config.
    "pyyaml>=6.0",
    # Phase 4: dashboard API.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Phase 5: the Tradier adapter. Tradier publishes no SDK, so this is how the vendor
    # is reached. Already present transitively for the API tests; named here because a
    # runtime dependency that only arrives through a dev extra is a broken install
    # waiting for the first person who does not install the dev extra.
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pre-commit>=3.7",
    # Independent oracle for the greeks and vol tests. Not a runtime dependency:
    # our pricing is our own, and vollib exists to disagree with it if we are wrong.
    "vollib>=1.0.11",
    # Exercises the API without a running server.
    "httpx>=0.27",
]

[project.scripts]
optscan = "optscan.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/optscan"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "TID",  # tidy imports
    "PL",   # pylint subset
    "RUF",  # ruff-specific
]
ignore = [
    "PLR0913",  # many arguments is normal for pricing functions
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "PLR2004",  # magic values are the point of a test
    "PLC0415",  # a local import keeps a test's setup next to the assertion it serves
    "TID251",   # the adapter tests drive httpx with a mock transport, offline
]
"src/optscan/providers/*" = ["TID251"]        # the one place vendor SDKs are allowed
# Deferred imports, deliberately: the CLI stays fast to start and a broker SDK is only
# imported by someone who configured that broker.
#
# PLR0915 and PLR0911 cover the argument parser and the subcommand dispatchers. Both
# are long because they are flat: one statement per flag, one return per subcommand.
# Splitting them to satisfy a counter would scatter the definition of the command line
# across several functions, which is harder to read rather than easier.
"src/optscan/cli.py" = ["PLC0415", "PLR0915", "PLR0911"]
"src/optscan/providers/__init__.py" = ["PLC0415"]
# Options pricing has a signature convention that every textbook and every other
# library shares: (right, spot, strike, time, rate, sigma, dividend_yield), positional
# and in that order. Forcing keyword-only arguments to satisfy a counter would make
# this code harder to check against a reference, which is the opposite of the goal.
# PLR0911 covers the vol solver and the interpolators, where each early return is a
# distinct named refusal and collapsing them would hide the taxonomy.
"src/optscan/analytics/*" = ["PLR0917", "PLR0911"]
# Same reason for the screener: each early return is a distinct named refusal or a
# distinct reason a session cannot contribute to the history.
"src/optscan/screener/*" = ["PLR0917", "PLR0911"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"yfinance".msg = "Market data vendors are only imported inside optscan.providers."
# Phase 5 added Tradier, which has no SDK: it is reached over plain HTTP. So the thing
# to ban is the HTTP client itself, which is what a shortcut to a vendor endpoint from
# a router or a job would have to import. Same rule as yfinance, one layer down.
"httpx".msg = "Vendor HTTP calls are only made inside optscan.providers."
"optscan.providers.tradier".msg = "Build providers through get_provider, not by importing the adapter."

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:optscan.*"]

[tool.coverage.run]
source = ["src/optscan"]
branch = true
