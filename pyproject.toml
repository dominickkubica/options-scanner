[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "optscan"
version = "0.1.0"
description = "Options selling scanner and dashboard"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    # Phase 1: data layer
    "yfinance>=0.2.40",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "pandas-market-calendars>=4.4",
    # Phase 2: analytics. scipy is used only for root finding in the vol solver.
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pre-commit>=3.7",
    # Independent oracle for the greeks and vol tests. Not a runtime dependency:
    # our pricing is our own, and vollib exists to disagree with it if we are wrong.
    "vollib>=1.0.11",
]

[project.scripts]
optscan = "optscan.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/optscan"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "TID",  # tidy imports
    "PL",   # pylint subset
    "RUF",  # ruff-specific
]
ignore = [
    "PLR0913",  # many arguments is normal for pricing functions
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "PLR2004",  # magic values are the point of a test
    "PLC0415",  # a local import keeps a test's setup next to the assertion it serves
]
"src/optscan/providers/*" = ["TID251"]        # the one place vendor SDKs are allowed
# Deferred imports, deliberately: the CLI stays fast to start and a broker SDK is only
# imported by someone who configured that broker.
"src/optscan/cli.py" = ["PLC0415"]
"src/optscan/providers/__init__.py" = ["PLC0415"]
# Options pricing has a signature convention that every textbook and every other
# library shares: (right, spot, strike, time, rate, sigma, dividend_yield), positional
# and in that order. Forcing keyword-only arguments to satisfy a counter would make
# this code harder to check against a reference, which is the opposite of the goal.
# PLR0911 covers the vol solver and the interpolators, where each early return is a
# distinct named refusal and collapsing them would hide the taxonomy.
"src/optscan/analytics/*" = ["PLR0917", "PLR0911"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"yfinance".msg = "Market data vendors are only imported inside optscan.providers."

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:optscan.*"]

[tool.coverage.run]
source = ["src/optscan"]
branch = true
