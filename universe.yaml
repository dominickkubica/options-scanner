# Symbol universes for bulk price history.
#
# ## What this file is, and what it is not
#
# It is a **curated, dated list**, maintained by hand. It is not index membership and
# must never be described as such anywhere in the UI.
#
# Alpaca publishes 14,277 active US equities and carries no sector, industry or index
# field on any of them, so there is nothing to derive these groups from. Every ticker
# below was chosen deliberately. That has two consequences worth stating plainly:
#
#   - **`sp500` drifts.** Index membership changes several times a year, and this file
#     learns about it only when somebody edits it. Anything computed over `sp500` is
#     "these symbols" and not "the S&P 500", and a backtest that treats it as the index
#     is quietly survivorship biased: the constituents listed here are the ones that
#     were in the index recently enough to be typed, which is exactly the set that did
#     not get dropped for performing badly.
#   - **Every symbol is validated against the vendor before use.** `optscan prices sync`
#     reports which tickers did not resolve rather than dropping them, because a
#     silently missing symbol is a hole in a study nobody can see. Delistings, ticker
#     changes and acquisitions all show up this way.
#
# `date_checked` is when the list was last reconciled against reality by a human.
#
# Add a group by adding a key. Nothing in code enumerates these names.

meta:
  date_checked: 2026-09-07
  note: >
    Curated by hand. Not index membership. See the header before using any group as
    though it were a definitive constituent list.

